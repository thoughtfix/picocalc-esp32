; Porkocalc hardware test 00: Hello World / capability report.
; Proves the flash workflow and reports what the ESP32-S3 actually has.
; Safe to run on the bare board or inside the PicoCalc: it touches no header pins.

[env:esp32s3pico]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; Waveshare ESP32-S3-Pico: ESP32-S3R2 (2 MB quad PSRAM in package) + 16 MB W25Q128 flash
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
; Opening the native USB port with DTR/RTS asserted resets the S3 into download mode.
monitor_dtr = 0
monitor_rts = 0

lib_deps =
    symlink://../..
